name: Update Teletext Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  export-and-push:
    runs-on: self-hosted    # runs on your VPS, not GitHub's infrastructure

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write database.php from secrets
        run: |
          cat > php/database.php << 'PHP'
          <?php
          $conn = mysqli_connect(
              '${{ secrets.DB_HOST }}',
              '${{ secrets.DB_USER }}',
              '${{ secrets.DB_PASS }}',
              '${{ secrets.DB_NAME }}'
          );
          PHP

      - name: Export database to JSON
        run: php php/export-json_extravision.php

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add php/teletext_data.json
          git diff --staged --quiet || git commit -m "Update teletext data [automated]"
          git push
