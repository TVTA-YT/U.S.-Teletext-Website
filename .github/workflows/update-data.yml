name: Update Teletext Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  export-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Export database to JSON
        run: php php/export_json.php

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add php/teletext_data.json
          git diff --staged --quiet || git commit -m "Update teletext data [automated]"
          git push